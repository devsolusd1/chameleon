name: Republish metadata

# Backup pacing for the metadata touch (the site's own traffic paces it
# too). Every ~5 minutes; also runnable on demand from the Actions tab.
# Set AUTO_REPUBLISH=off on Vercel to disable touches entirely.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Touch metadata
        run: |
          curl -sS -X POST "https://www.chameleoncoin.fun/api/republish" \
            -H "Authorization: Bearer ${{ secrets.REPUBLISH_SECRET }}" \
            --max-time 55 -w "\nHTTP %{http_code}\n"
