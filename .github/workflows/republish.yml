name: Republish metadata

# Manual-only: automatic touches were disabled (set AUTO_REPUBLISH=on on
# Vercel to re-enable the traffic-driven pacing). This workflow remains
# for on-demand runs from the Actions tab.
on:
  workflow_dispatch:

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Touch metadata
        run: |
          curl -sS -X POST "https://www.chameleoncoin.fun/api/republish" \
            -H "Authorization: Bearer ${{ secrets.REPUBLISH_SECRET }}" \
            --max-time 55 -w "\nHTTP %{http_code}\n"
